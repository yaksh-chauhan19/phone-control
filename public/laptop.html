<!DOCTYPE html>
<html>
<head>
    <title>Phone Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; text-align: center;
               background: #0a0a0a; color: white; padding: 20px;
               min-height: 100vh; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 30px; }
        input { font-size: 36px; text-align: center; padding: 15px;
                border-radius: 12px; border: 2px solid #0088ff;
                background: #1a1a1a; color: white; width: 220px;
                letter-spacing: 10px; }
        button { font-size: 20px; padding: 15px; margin-top: 20px;
                 background: #0088ff; color: white; border: none;
                 border-radius: 12px; cursor: pointer; width: 220px;
                 font-weight: bold; }
        #status { margin-top: 20px; font-size: 18px;
                  color: #0088ff; line-height: 1.6; }
        video { width: 380px; max-width: 95vw; border-radius: 20px;
                margin-top: 20px; border: 2px solid #0088ff;
                display: none; background: #111; }
        .dot { display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
</head>
<body>
    <h1>💻 Laptop Side</h1>
    <p>Enter same passcode as phone</p>
    <input id="passcode" type="number" placeholder="1234" maxlength="4"/>
    <br>
    <button onclick="connect()">Connect to Phone</button>
    <div id="status"></div>
    <video id="phoneScreen" autoplay playsinline></video>
    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
    <script>
        const socket = io();
        let pc;

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
            ]
        };

        function connect() {
            const passcode = document.getElementById('passcode').value;
            const status = document.getElementById('status');
            if (!passcode || passcode.length < 4) {
                status.textContent = '⚠️ Enter a 4-digit passcode!';
                return;
            }

            socket.emit('laptop-join', passcode);
            status.innerHTML = '🔍 Looking for phone<span class="dot">...</span>';

            socket.on('error', (msg) => {
                status.textContent = '❌ ' + msg;
            });

            socket.on('start-connection', () => {
                status.textContent = '🔗 Phone found! Connecting...';

                pc = new RTCPeerConnection(iceConfig);

                // Send ICE candidates to phone
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        socket.emit('signal', { passcode, data: { type: 'candidate', candidate: e.candidate }});
                    }
                };

                // Show phone screen when stream arrives
                pc.ontrack = (e) => {
                    status.textContent = '✅ Phone screen is live!';
                    const video = document.getElementById('phoneScreen');
                    video.style.display = 'block';
                    video.srcObject = e.streams[0];
                };

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'failed') {
                        status.textContent = '❌ Connection failed. Try again.';
                    }
                };
            });

            // Handle offer and ICE from phone
            socket.on('signal', async (data) => {
                if (!pc) return;
                try {
                    if (data.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.emit('signal', { passcode, data: { type: 'answer', sdp: pc.localDescription }});
                        status.textContent = '📤 Answer sent! Waiting for stream...';
                    } else if (data.type === 'candidate') {
                        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                } catch(e) {
                    status.textContent = '❌ Error: ' + e.message;
                }
            });

            socket.on('peer-disconnected', () => {
                status.textContent = '📵 Phone disconnected!';
                document.getElementById('phoneScreen').style.display = 'none';
                if (pc) pc.close();
            });
        }
    </script>
</body>
</html>
