<!DOCTYPE html>
<html>
<head>
    <title>Phone Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; text-align: center;
               background: #0a0a0a; color: white; padding: 40px 20px;
               min-height: 100vh; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 30px; }
        input { font-size: 36px; text-align: center; padding: 15px;
                border-radius: 12px; border: 2px solid #00ff88;
                background: #1a1a1a; color: white; width: 220px;
                letter-spacing: 10px; }
        button { font-size: 20px; padding: 15px;
                 margin-top: 20px; background: #00ff88;
                 color: black; border: none; border-radius: 12px;
                 cursor: pointer; width: 220px; font-weight: bold; }
        #status { margin-top: 30px; font-size: 18px;
                  color: #00ff88; line-height: 1.6; }
        .dot { display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
</head>
<body>
    <h1>📱 Phone Side</h1>
    <p>Enter passcode to share your screen</p>
    <input id="passcode" type="number" placeholder="1234" maxlength="4"/>
    <br>
    <button onclick="connect()">Start Sharing</button>
    <div id="status"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let pc;

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
            ]
        };

        async function connect() {
            const passcode = document.getElementById('passcode').value;
            const status = document.getElementById('status');
            if (!passcode || passcode.length < 4) {
                status.textContent = '⚠️ Enter a 4-digit passcode!';
                return;
            }
            status.innerHTML = '🎥 Starting screen capture<span class="dot">...</span>';
            let stream;
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30 },
                    audio: false
                });
            } catch(e) {
                status.textContent = '❌ Screen capture was denied! Please allow it.';
                return;
            }

            socket.emit('phone-join', passcode);
            status.innerHTML = '📡 Waiting for laptop to connect<span class="dot">...</span>';

            socket.on('start-connection', async () => {
                status.textContent = '🔗 Laptop found! Setting up stream...';

                pc = new RTCPeerConnection(iceConfig);

                // Add screen stream tracks
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                // Send ICE candidates to laptop
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        socket.emit('signal', { passcode, data: { type: 'candidate', candidate: e.candidate }});
                    }
                };

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'connected') {
                        status.textContent = '✅ Connected! Laptop can see your screen!';
                    } else if (pc.connectionState === 'failed') {
                        status.textContent = '❌ Connection failed. Try again.';
                    }
                };

                // Create and send offer
                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('signal', { passcode, data: { type: 'offer', sdp: pc.localDescription }});
                } catch(e) {
                    status.textContent = '❌ Error: ' + e.message;
                }
            });

            // Handle answer and ICE from laptop
            socket.on('signal', async (data) => {
                if (!pc) return;
                try {
                    if (data.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    } else if (data.type === 'candidate') {
                        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                } catch(e) {
                    status.textContent = '❌ Signal error: ' + e.message;
                }
            });

            socket.on('peer-disconnected', () => {
                status.textContent = '📵 Laptop disconnected!';
                if (pc) pc.close();
            });
        }
    </script>
</body>
</html>
